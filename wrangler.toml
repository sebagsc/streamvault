# ============================================
# StreamVault - Cloudflare Workers Configuration
# VERSION 100% GRATIS (Free Tier)
# ============================================
# 
# STACK GRATUITO:
# - Cloudflare Workers: 100,000 requests/dia
# - Cloudflare Pages: Ilimitado
# - D1 Database: 5M queries/mes
# - KV: 1GB storage, 10M reads/mes
#
# NOTA: Sin Durable Objects (requieren plan de pago)
# Chat y presencia usan polling HTTP + D1
#
# INSTRUCCIONES DE CONFIGURACION:
#
# 1. Reemplaza YOUR_ACCOUNT_ID con tu Cloudflare Account ID
#    → Obtener: https://dash.cloudflare.com (sidebar derecho)
#
# 2. Sube este archivo a GitHub
#
# 3. Ve a GitHub → Actions → "Setup Cloudflare Infrastructure"
#    → Click "Run workflow" → Selecciona "setup-all"
#
# 4. Copia los IDs que aparecen en los logs
#
# 5. Reemplaza aquí:
#    - YOUR_D1_DATABASE_ID → el uuid de iptv-db
#    - YOUR_KV_NAMESPACE_ID → el id de KV
#
# 6. Sube los cambios y ejecuta "apply-schema" y "deploy-worker"
#
# ============================================

name = "iptv-api"
main = "workers/src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ============================================
# ACCOUNT ID
# ============================================
account_id = "f99f865c4525df962a429c132ec94303"

# ============================================
# D1 DATABASE
# ============================================
[[d1_databases]]
binding = "DB"
database_name = "iptv-db"
database_id = "ae6d0626-caa7-41cd-8b9e-ae3b6a6c5f72"

[[env.production.d1_databases]]
binding = "DB"
database_name = "iptv-db"
database_id = "ae6d0626-caa7-41cd-8b9e-ae3b6a6c5f72"

# ============================================
# KV NAMESPACE
# ============================================
[[kv_namespaces]]
binding = "kv_namespaces"
id = "bbe315b5eb8246f3b2c089d0cce8e13f"

[[env.production.kv_namespaces]]
binding = "kv_namespaces"
id = "bbe315b5eb8246f3b2c089d0cce8e13f"

# NOTA: Durable Objects removidos para mantener plan gratuito
# El chat y presencia ahora usan polling HTTP + D1

# ============================================
# CRON TRIGGERS
# ============================================
[triggers]
crons = [
  "0 */6 * * *",   # KV cache refresh every 6 hours
  "* * * * *"       # Push notification sender every minute
]

# ============================================
# ENVIRONMENT VARIABLES (NO SENSITIVES)
# ============================================
[vars]
TOTP_ISSUER_NAME = "IPTV Stream"
FRONTEND_URL = "https://your-pages-domain.pages.dev"

# ============================================
# SECRETS (configurar en Cloudflare Dashboard)
# Dashboard: Workers & Pages → iptv-api → Settings → Variables
#
# Variables a agregar (como "Secrets" encriptados):
#
#   JWT_SECRET          → Genera en https://www.random.org/strings/
#   VAPID_PUBLIC_KEY    → Genera en https://web-push-codelab.glitch.me/
#   VAPID_PRIVATE_KEY   → Par de la clave pública
#   VAPID_SUBJECT       → mailto:tu-email@ejemplo.com
#
# ============================================
