name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-worker:
    name: Deploy Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler Globally
        run: npm install -g wrangler@latest

      - name: Configure Wrangler
        run: |
          mkdir -p ~/.config/.wrangler
          echo "account_id = \"${{ secrets.CLOUDFLARE_ACCOUNT_ID }}\"" > ~/.config/.wrangler/config.toml
          
          if [ -n "${{ secrets.CLOUDFLARE_EMAIL }}" ]; then
            echo "email = \"${{ secrets.CLOUDFLARE_EMAIL }}\"" >> ~/.config/.wrangler/config.toml
            echo "api_key = \"${{ secrets.CLOUDFLARE_API_TOKEN }}\"" >> ~/.config/.wrangler/config.toml
          fi

      - name: Install dependencies
        working-directory: ./workers
        run: npm install

      - name: Deploy Worker
        working-directory: ./workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler deploy

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler Globally
        run: npm install -g wrangler@latest

      - name: Configure Wrangler
        run: |
          mkdir -p ~/.config/.wrangler
          echo "account_id = \"${{ secrets.CLOUDFLARE_ACCOUNT_ID }}\"" > ~/.config/.wrangler/config.toml
          
          if [ -n "${{ secrets.CLOUDFLARE_EMAIL }}" ]; then
            echo "email = \"${{ secrets.CLOUDFLARE_EMAIL }}\"" >> ~/.config/.wrangler/config.toml
            echo "api_key = \"${{ secrets.CLOUDFLARE_API_TOKEN }}\"" >> ~/.config/.wrangler/config.toml
          fi

      - name: Install dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler pages deploy frontend/dist --project-name=iptv-frontend
